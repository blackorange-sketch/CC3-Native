name: Android APK

# Two channels:
#  * every push to main -> the 'nightly' pre-release (test builds, tag moved to the built commit)
#  * Actions -> "Android APK" -> Run workflow with a version (e.g. 0.2.0), or a pushed tag vX.Y.Z -> a stable release
#    'vX.Y.Z' with its own version number and a changelog
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to release, e.g. 0.2.0 (leave empty for a nightly build)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths: ['runtime/**', 'tools/**', 'android/**', '.github/workflows/android.yml']

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags and history for the changelog

      - name: Channel and version
        env: { INPUT_VERSION: '${{ inputs.version }}' }
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V=""; fi
          if [ -n "$V" ]; then
            [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$V'"; exit 1; }
            echo "CHANNEL=stable" >> $GITHUB_ENV; echo "APP_VERSION=$V" >> $GITHUB_ENV; echo "TAG=v$V" >> $GITHUB_ENV
          else
            echo "CHANNEL=nightly" >> $GITHUB_ENV; echo "APP_VERSION=nightly" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # The ubuntu runner already ships the Android SDK/NDK; just accept licences.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # The user's own cnc3game.dat (Steam 1.9, no SecuROM) lives in a separate PRIVATE repo (blackorange-sketch/cc3-private,
      # release "game-binary"), read with the GAME_REPO_TOKEN secret. It is only used inside this job; neither it nor the
      # generated code is published.
      - name: Fetch cnc3game.dat
        env: { GH_TOKEN: '${{ secrets.GAME_REPO_TOKEN }}' }
        run: |
          gh release download game-binary -R blackorange-sketch/cc3-private -p cnc3game.dat -D game
          sha256sum game/cnc3game.dat
          echo "GAME_SHA256=$(sha256sum game/cnc3game.dat | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Build Capstone
        run: |
          git clone https://github.com/capstone-engine/capstone
          git -C capstone checkout 04fd70b5456c20fc27d1f2b62d6ed0820fc6b081
          for i in 1 2 3 4 5; do sudo apt-get install -y ninja-build >/dev/null && break; sleep 15; sudo apt-get update >/dev/null || true; done; command -v ninja
          cmake -S capstone -B capstone/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON -DCAPSTONE_BUILD_SHARED_LIBS=OFF -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF -DCAPSTONE_BUILD_CSTEST=OFF -DCAPSTONE_BUILD_LEGACY_TESTS=OFF
          ninja -C capstone/b

      - name: Analyze and lift
        run: |
          g++ -O2 -std=c++17 -Icapstone/include tools/analyze.cpp capstone/b/libcapstone.a -o analyze
          g++ -O2 -std=c++17 -Icapstone/include tools/lift.cpp tools/lift_pe.cpp capstone/b/libcapstone.a -o lift_pe
          ./analyze game/cnc3game.dat game/cc3 | tee analyze.txt | head -40
          mkdir -p lifted
          # no RA3_GATES / RA3_HOOKS for CC3 yet (runtime/game_build.h has no game addresses)
          ./lift_pe game/cnc3game.dat game/cc3.functions.txt --emit-dir lifted 96 | tee lift-stats.txt | head -20

      # Import coverage: every import of the binary should have a host implementation (or a deliberate stub)
      - name: Import coverage
        run: |
          python3 tools/pe_imports.py game/cnc3game.dat | sed -n '1,20p'   # sections: SecuROM would show up here
          python3 tools/pe_imports.py game/cnc3game.dat --json > imports.json
          python3 tools/coverage.py imports.json runtime | tee coverage.txt

      # The generated code is identical between runs, so ccache makes rebuilds after runtime-only edits take minutes.
      - name: Set up ccache
        run: for i in 1 2 3; do sudo apt-get install -y ccache >/dev/null && break; sleep 20; sudo apt-get update >/dev/null || true; done; true
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Stamp build id
        run: |
          echo '#define RA3_BUILD_ID "${{ github.sha }}"' > runtime/build_id.h
          echo "#define RA3_VERSION \"$APP_VERSION\"" >> runtime/build_id.h
      - name: Build APK
        working-directory: android
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_NODIRECT: '1'
          CCACHE_COMPILERCHECK: 'string:ndk'
          CCACHE_MAXSIZE: 2G
        run: |
          export CCACHE_DIR=$HOME/.ccache
          CC_OPT=""; command -v ccache >/dev/null && CC_OPT="-PuseCcache=1"
          gradle assembleDebug -PbuildId=${{ github.sha }} -PversionName=$APP_VERSION -PversionCode=${{ github.run_number }} -PliftedDir=${{ github.workspace }}/lifted -PgameSha256=$GAME_SHA256 $CC_OPT --no-daemon
          command -v ccache >/dev/null && ccache -s | head -8 || echo "built without ccache"

      # Symbols of the runtime (static functions have no dynamic symbol): the profiler (/sdcard/ra3_prof) logs raw
      # offsets that are resolved with this list. Lifted game functions (f_<address>) are left out, they are exported.
      - name: Runtime symbol list
        run: |
          SO=$(find android/app/build/intermediates -path '*arm64-v8a*' -name libcc3native.so -size +1M | xargs ls -S | head -1)
          NM=$(ls $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | head -1)
          "$NM" -n -S -C --defined-only "$SO" | grep -iv ' f_00[0-9a-f]*(CPU\*)' | grep -i ' [tw] ' > cc3native-symbols.txt || true
          wc -l cc3native-symbols.txt; echo "from $SO"

      # The APK is published as a release asset (does not count against the Actions artifact quota).
      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "${TAG:-none}" HEAD 2>/dev/null || true)
          echo "PREV=$PREV" >> $GITHUB_ENV
          if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..HEAD" > changes.md; else git log --no-merges --pretty='- %s' -n 40 > changes.md; fi

      - name: Publish nightly
        if: env.CHANNEL == 'nightly'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cc3-native.apk
          git tag -f nightly "$GITHUB_SHA" && git push -f origin refs/tags/nightly
          {
            echo "**Test build** of \`${GITHUB_SHA::7}\` ($(date -u +%F\ %H:%M) UTC). It may be broken — stable versions are on the [releases page](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
            echo
            echo "Android 10+, arm64. \`cc3-native.apk\`: $(stat -c %s cc3-native.apk) bytes, SHA-256 \`$(sha256sum cc3-native.apk | cut -d' ' -f1)\` — if the installer says the file is invalid, the download was incomplete: download it again and compare."
            echo
            echo "### Changes since ${PREV:-the first commit}"
            cat changes.md
          } > notes.md
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --title "Nightly build" --notes "Nightly" --prerelease --target "$GITHUB_SHA"
          touch -a lift-stats.txt
          touch -a coverage.txt
          gh release upload nightly cc3-native.apk cc3native-symbols.txt lift-stats.txt coverage.txt --clobber
          gh release edit nightly --notes-file notes.md --prerelease

      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          APK="cc3-native-$TAG.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            echo "Install **$APK** (Android 10+, arm64). You need your own copy of C&C 3 Tiberium Wars (Steam, 1.9) — see the [installation guide](https://github.com/$GITHUB_REPOSITORY#installation)."
            echo
            echo "\`$APK\`: $(stat -c %s "$APK") bytes, SHA-256 \`$(sha256sum "$APK" | cut -d' ' -f1)\` — if the installer says the file is invalid, the download was incomplete: download it again and compare."
            echo
            # hand-written notes in docs/releases/<tag>.md when present, the commit list below them
            if [ -f "docs/releases/$TAG.md" ]; then
              cat "docs/releases/$TAG.md"; echo
              echo "<details><summary>All changes since ${PREV:-the first commit}</summary>"; echo; cat changes.md; echo; echo "</details>"
            else
              echo "### Changes since ${PREV:-the first commit}"
              cat changes.md
            fi
          } > notes.md
          gh release create "$TAG" "$APK" cc3native-symbols.txt --title "CC3 Native $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          # the old single 'latest' pre-release shadows GitHub's /releases/latest link
          gh release delete latest --cleanup-tag -y 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cc3-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

